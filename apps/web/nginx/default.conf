# SPA (React + Vite). Self-contained static server for k8s (Deployment
# behind an Ingress) and standalone Docker Compose mode.
#
# Generic security headers (HSTS, X-Frame-Options, ...) are added by the
# reverse proxy in front (Traefik `security-headers` middleware in k8s,
# Caddy in standalone mode); CSP stays here because it is app-specific.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback — /api and /callback are routed to twitch-api
    # by the Ingress / reverse proxy in front.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
