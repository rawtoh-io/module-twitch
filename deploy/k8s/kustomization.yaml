# Module Twitch — k3s manifests. Deploys into the shared `rawtoh` namespace
# of the main Rawtoh cluster (see DEPLOYMENT.md in rawtoh-io/app).
#
# Apply (CI does exactly this):
#   export DOMAIN=rawtoh.io
#   kubectl kustomize deploy/k8s | envsubst '$DOMAIN' | kubectl apply -f -
#
# Secrets are NOT here: created once from bootstrap/secrets.example.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: module-twitch
    includeSelectors: true
