# Copy to secrets.yaml (gitignored), fill in the values, apply ONCE:
#   cp deploy/k8s/bootstrap/secrets.example.yaml deploy/k8s/bootstrap/secrets.yaml
#   $EDITOR deploy/k8s/bootstrap/secrets.yaml
#   kubectl apply -f deploy/k8s/bootstrap/secrets.yaml
#
# CI never touches this Secret. Rotate by editing and re-applying, then:
#   kubectl -n rawtoh rollout restart deployment/twitch-api
apiVersion: v1
kind: Secret
metadata:
  name: twitch-secrets
  namespace: rawtoh
type: Opaque
stringData:
  # Must match the password inside DATABASE_URL.
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgres://rawtoh:CHANGE_ME@twitch-postgres:5432/twitch
  # 64+ random chars (Hono session cookie encryption)
  SESSION_SECRET: CHANGE_ME
  # Encrypts the Ed25519 private keys at rest: openssl rand -base64 32
  # Keep it separate from SESSION_SECRET — rotating the session secret is
  # routine, rotating this one forces every account to re-enroll.
  ENCRYPTION_KEY: CHANGE_ME
  # OIDC client used to sign users in with their Rawtoh account (this is
  # not how the module authenticates to the hub — that is an Ed25519 key
  # generated at enrollment and stored in the module's own database).
  RAWTOH_CLIENT_ID: rth_c_CHANGE_ME
  RAWTOH_CLIENT_SECRET: rth_s_CHANGE_ME
  # Twitch OAuth app
  TWITCH_CLIENT_ID: CHANGE_ME
  TWITCH_CLIENT_SECRET: CHANGE_ME
