apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twitch-pgdata
  namespace: rawtoh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-postgres
  namespace: rawtoh
spec:
  replicas: 1
  # RWO volume: a rolling update would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: twitch-postgres
  template:
    metadata:
      labels:
        app: twitch-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: twitch-config
            - secretRef:
                name: twitch-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: twitch-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: twitch-postgres
  namespace: rawtoh
spec:
  selector:
    app: twitch-postgres
  ports:
    - port: 5432
      targetPort: 5432
